<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Recuperar Senha - FLF</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="../static/img/flflogoshort.png">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="bg-linear">
    
    <div class="d-flex justify-content-center align-items-center vh-100 p-3">
        <div class="login-card">
            <img src="../static/img/logo-removebg-preview.png" alt="Logo FLF" class="img-login">
            <h2 class="fw-bold text-center mb-2">Recuperar Senha</h2>
            <p class="text-center text-muted small mb-3">Informe seu e-mail e telefone cadastrados para validar sua identidade.</p>

            <form id="form-recuperar" method="POST" action="{{ url_for('recuperar_senha.verificar') }}">
                <!-- Campo de E-mail -->
                
                <div class="w-100">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text border-icon"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control" placeholder="E-mail do Usuário" name="email" value="{{ email if email else '' }}" required>
                    </div>
                </div>
                
                <!-- Campo de Telefone -->
                <div class="w-100">
                    <label for="telefone" class="form-label">Telefone</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text border-icon"><i class="bi bi-telephone-fill"></i></span>
                        <input type="tel" class="form-control" placeholder="Telefone com DDD" name="telefone" value="{{ telefone if telefone else '' }}" inputmode="numeric" pattern="[0-9]{10,11}" title="Digite apenas números, com DDD (10 ou 11 dígitos)" maxlength="11" oninput="this.value = this.value.replace(/\D/g, '')" required>
                    </div>
                </div>

                <!-- Exibição de Mensagem de Erro (caso dados não coincidam) -->
                {% if erro and erro != "" %}
                    <div id="msg-erro" class="alert alert-danger" role="alert">
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        <strong>Erro:</strong> {{ erro }}
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100 text-dark text-black fw-semibold mb-3">Verificar Dados</button>

                <p class="text-center mb-0">
                    Lembrou a senha? 
                    <a href="{{ url_for('login.login') }}" class="text-b fw-semibold text-decoration-none">Voltar ao Login</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
