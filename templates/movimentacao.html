<!DOCTYPE html>

<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            CONTROLE DE ESTOQUE - FLF
        </title>
        <link rel="stylesheet" href="../static/css/variables.css">
        <link rel="stylesheet" href="../static/css/elements.css">
        <link rel="stylesheet" href="../static/css/class.css">
        <link rel="stylesheet" href="../static/css/global.css">
        <script src="../static/js/script.js" defer></script>
    </head>

    <body>
        <header>

            <div class="part-header">
                <img class="logo-user" src="../static/img/flflogoshort.png">
                <h1>CONTROLE DE ESTOQUE DE EQUIPAMENTOS</h1>
            </div>

            <div class="part-header">
                <p>Usuário: {{ name }}</p>
                <div class="icon-container">
                    <button id="btn-icon" class="icon-btn">
                        <img class="logo-user" src="../static/img/user.png">
                    </button>

                    <!--Janela Modal da Conta-->
                    <div id="modal-suspensao" class="modal-popover"> 
                        <!--Inserir informações em relação a conta, ai decide se só vai ser nome, histórico e sair da conta-->
                        <h3 class="dropdown-item">Nome da Conta</h3>
                        <button class="dropdown-item">Perfil</button>
                        <button class="dropdown-item">Histórico</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger">Sair da Conta</button>
                    </div>
                </div>
            </div>

        </header>

        <main>

            <section id="classbar" class="sidebar">
                <aside>
                    <nav>
                        <ul>
                            <li><a href="/dashboard">Início</a></li>
                            <li><a href="/equipamentos">Equipamentos</a></li>
                            <li><a href="/emprestimo">Movimentações</a></li>
                            <li><a href="relatorios.html">Relatórios</a></li>
                        </ul>
                    </nav>
                </aside>
            </section>

            <section class="main-content">
                <h2>Movimentações</h2>

                <div class="barra-pesquisa">

                    <input type="text" placeholder="Pesquisar por responsável..." class="pesquisa-enter">
                    <select class="filter-select">
                        <option value="todos">Todos</option>
                        <option value="pendente">Pendente</option>
                        <option value="devolvido">Devolvido</option>
                    </select>

                    <select class="filter-select" name = "filtro_categoria">
                            <option value="todos">Todas as categorias</option>
                            <option value="monitor">Monitores</option>
                            <option value="teclado">Teclados</option>
                            <option value="mouse">Mouses</option>
                    </select>

                    <button>+ Nova Movimentação</button>
                    
                </div>

                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data / Hora</th>
                                <th>Status</th>
                                <th>N° Série</th>
                                <th>Categoria</th>
                                <th>Responsável</th>
                            </tr>
                        </thead>
                        
                        <tbody>
                            <tr>
                                <td>04/09/2026 11:09</td>
                                <td><span class="badge" id="disponivel">Entrada</span></td>
                                <td>67676767</td>
                                <td></td>

                            </tr>
                            <tr>
                                <td>05/05/2026 11:11</td>
                                <td><span class="badge" id="manutencao">Saída</span></td>
                                <td>123456123</td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

    </body>
</html>
