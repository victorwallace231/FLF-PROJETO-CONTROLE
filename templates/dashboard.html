<!DOCTYPE html>

<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            CONTROLE DE ESTOQUE - FLF
        </title>
        <link rel="stylesheet" href="../static/css/index.css">
    </head>

    <body>
        <header>

            <div class="part-header">
                <img class="logo-user" src="../static/img/flflogoshort.png">
                <h1>CONTROLE DE ESTOQUE DE EQUIPAMENTOS</h1>
            </div>

            <div class="part-header">
                <p>Usuário: {{ name }}</p>
                <div class="icon-container">
                    <button id="btn-icon" class="icon-btn">
                        <img class="logo-user" src="../static/img/user.png">
                    </button>

                    <!--Janela Modal da Conta-->
                    <div id="modal-suspensao" class="modal-popover">
                        <h3>Login</h3>
                        <p>Alguma coisa para testar.</p>
                    </div>
                </div>
            </div>

        </header>

        <main>

            <section>
                <aside id="classbar" class="sidebar">
                    <nav>
                        <ul>
                            <li><a href="#">Início</a></li>
                            <li><a href="equipamentos.html">Equipamentos</a></li>
                            <li><a href="/emprestimo">Movimentações</a></li>
                            <li><a href="relatorios.html">Relatórios</a></li>
                        </ul>
                    </nav>
                </aside>
            </section>

            <section class="main-content">

                <div class="ballons-box">

                    <div id="ballon1" class="ballons-all">
                        <h3>Total: </h3>
                        <h2>50</h2>
                    </div>

                    <div id="ballon2" class="ballons-all">
                        <h3>Disponiveís: </h3>
                        <h2>50</h2>
                    </div>

                    <div id="ballon3" class="ballons-all">
                        <h3>Em Uso: </h3>
                        <h2>50</h2>
                    </div>

                    <div id="ballon4" class="ballons-all">
                        <h3>Em Manutenção: </h3>
                        <h2>50</h2>
                    </div>

                </div>

                <div class="tabelas-afins">
                    <div id="card-relatorio" class="cards-dash">
                        <h2>Relatórios recentes</h2>
                        <div class="temporario"></div>
                        <button><a href="relatorios.html">Abrir</a></button>
                    </div>

                    <div id="card-movimentacao" class="cards-dash">
                    </div>

                    <div id="card-acoes" class="cards-dash">
                        <h2>Ações Rápidas</h2>
                        <button><a href="#">Nova Movimentação</a></button>
                        <button><a href="#">Novo Equipamento</a></button>
                    </div>
                </div>

            </section>

        </main>

    </body>
</html>
