<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <title>Dashboad - Moderno</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../static/css/global.css">
        <link rel="stylesheet" href="../static/css/style1.css">
        <link rel="stylesheet" href="../static/css/dashboard.css">
        <script src="../static/js/script.js" defer></script>
</head>
<body>

    <div class="d-flex">
        <nav class="p-2 border-end navbar_dashboard vh-100">
            <ul class="nav flex-column">
                <li class="nav-item mb-3">
                    <a href=""><img src="../static/img/Logo_topo_Site.png" alt=""></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Equipamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Movimentações</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Sair</a>
                </li>
            </ul>
        </nav>
        <div class="w-100">
            <header>
                <div>
                <h2 class="fw-bold p-4">Dashboard</h2>
            </div> 
             <!--Usuário Principal-->
            <div class="part-header">
                <p>Usuário: {{ session.get('usuario_name') }}</p>
                <div class="icon-container">
                    <button id="btn-icon" class="icon-btn logo-user p-3">
                        <i class="bi bi-person-circle" alt="Icone do usuario"></i>
                    </button>
                    <div id="modal-suspensao" class="modal-popover"> 
                        <h3 class="dropdown-item">{{ session.get('usuario_name') }}</h3>                
                        <button type="button" class="dropdown-item">Perfil</button>
                        <form action="{{ url_for('user_historico.historico') }}" method="GET">
                            <button type="submit" class="dropdown-item">Histórico</button>
                        </form>
                        <div class="dropdown-divider"></div>
                        <form action="{{ url_for('logout.logout') }}" method="POST">
                            <button type="submit" class="dropdown-item danger">Sair da Conta</button>
                        </form>
                        </div>
                    </div>
                </div>
            </header>
        

        <!-- <div class="p-4 flex-grow-1">
        <h1>Bem-vindo ao Dashboard</h1>
        </div> -->

        <main class="d-grid d-flex justify-content-center gap-4 bi-grid-1x2-gap p-4">
            
            <section class="main-content">

                <!--Visão Geral dos Equipamentos-->
                <div class="ballons-box">

                    <div id="ballon1" class="ballons-all">
                        <h4>Total: </h4>
                        <h3>{{ total_perifericos }}</h3>
                    </div>

                    <div id="ballon2" class="ballons-all">
                        <h4>Disponiveís: </h4>
                        <h3>{{ disponiveis }}</h3>
                    </div>

                    <div id="ballon3" class="ballons-all">
                        <h4>Em Uso: </h4>
                        <h3>{{ usados }}</h3>
                    </div>

                    <div id="ballon4" class="ballons-all">
                        <h4>Em Manutenção: </h4>
                        <h3>{{ manutencao }}</h3>
                    </div>

                </div>


                <!--Cards Informativos de Atualizações, e Ações Rápidas-->
                <div class="tabelas-afins d-flex gap-4 justify-content-center align-content-center m-5">

                    <!--Ações Rápidas (Ou Atalhos)-->
                    <div id="card-acoes" class="cards-dash">
                        <h2 class="d-flex justify-content-center">Ações Rápidas</h2>
                        <button ><a href="{{ url_for('create_emprestimo.create') }}">Nova Movimentação</a></button>
                        <button ><a href="{{ url_for('create_item.create') }}">Novo Equipamento</a></button>
                    </div>
                </div>

            </section>

        </main>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
