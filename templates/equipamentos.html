<!DOCTYPE html>

<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            CONTROLE DE ESTOQUE - FLF
        </title>
        <link rel="stylesheet" href="../static/css/global.css">
        <script src="../static/js/script.js" defer></script>
    </head>

    <body>
        <header>

            <div class="part-header">
                <img class="logo-user" src="../static/img/flflogoshort.png">
                <h1>CONTROLE DE ESTOQUE DE EQUIPAMENTOS</h1>
            </div>

            <div class="part-header">
                <p>{{ name }}</p>
                <div class="icon-container">
                    <button id="btn-icon" class="icon-btn">
                        <img class="logo-user" src="../static/img/user.png">
                    </button>

                    <!--Janela Modal da Conta-->
                    <div id="modal-suspensao" class="modal-popover">
                        <h3>Login</h3>
                        <p>Alguma coisa para testar.</p>
                    </div>
                </div>
            </div>

        </header>

        <main>

            <section>
                <aside id="classbar" class="sidebar">
                    <nav>
                        <ul>
                            <li><a href="dashboard.html">Início</a></li>
                            <li><a href="#">Equipamentos</a></li>
                            <li><a href="movimentacao.html">Movimentações</a></li>
                            <li><a href="relatorios.html">Relatórios</a></li>
                        </ul>
                    </nav>
                </aside>
            </section>

            <section class="main-content">
                
                <h2>Gerenciamento de Inventário de Equipamentos</h2>
                
                <div class="barra-pesquisa">
                    <input type="text" placeholder="Pesquisar por modelo, patrimônio..." class="pesquisa-enter">

                    <select class="filter-select">
                        <option value="">Todas as categorias</option>
                        <option value="monitor">Monitores</option>
                        <option value="teclado">Teclados</option>
                        <option value="mouse">Mouses</option>
                    </select>

                    <select class="filter-select">
                        <option value="">Todos os status</option>
                        <option value="disponivel">Disponíveis</option>
                        <option value="em-uso">Em Uso</option>
                        <option value="manutencao">Em Manutenção</option>
                    </select>

                    <button>+ Adicionar Equipamento</button>
                </div>

                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Miniatura</th>
                                <th>Número de Série</th>
                                <th>Marca</th>
                                <th>Categoria</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        
                        <tbody>
                            <tr>
                                <td>
                                    <img src="../static/img/monitor_dell.webp" class="thumb">
                                </td>
                                <td>010621</td>
                                <td>Dell</td>
                                <td>Monitor</td>
                                <td><span class="badge" id="disponivel">Disponivel</span></td>
                                <td class="action-cell">
                                    <div class="action-menu">
                                        <button class="btn-icon" onclick="toggleMenu(event)">⋮</button>

                                        <div class="dropdown-menu">
                                            <button class="dropdown-item">Visualizar</button>
                                            <button class="dropdown-item">Editar</button>
                                            <button class="dropdown-item">Histórico</button>
                                            <div class="dropdown-divider"></div>
                                            <button class="dropdown-item danger">Excluir</button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </body>
</html>
