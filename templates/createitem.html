<!DOCTYPE html>
<html lang="pt-br">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../static/css/variables.css">
        <link rel="stylesheet" href="../static/css/elements.css">
        <link rel="stylesheet" href="../static/css/class.css">
        <link rel="stylesheet" href="../static/css/createitem.css">
        <link rel="stylesheet" href="../static/css/style.css">
        <link rel="stylesheet" href="../static/css/global.css">
        <script src="../static/js/script.js" defer></script>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <title>CONTROLE DE ESTOQUE - FLF</title>
    </head>

    <body>

        <!--Cabeçalho-->
        <header>

            <div class="part-header">
                <img class="logo-user" src="../static/img/flflogoshort.png">
                <h1>CONTROLE DE ESTOQUE DE EQUIPAMENTOS</h1>
            </div>

            <!--Usuário Principal-->
            <div class="part-header">
                <p>Usuário: {{ name }}</p>
                <div class="icon-container">
                    <button id="btn-icon" class="icon-btn">
                        <img class="logo-user" src="../static/img/user.png">
                    </button>

                    <!--Janela Modal da Conta-->
                    <div id="modal-suspensao" class="modal-popover"> 
                        <!--Inserir informações em relação a conta, ai decide se só vai ser nome, histórico e sair da conta-->
                        <h3 class="dropdown-item">Nome da Conta</h3>
                        <button class="dropdown-item">Perfil</button>
                        <button class="dropdown-item">Histórico</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger">Sair da Conta</button>
                    </div>
                </div>
            </div>

        </header>

        <!--Menu Lateral e Conteúdo da Página-->
        <main>


            <!--Menu Lateral Sempre à Esquerda-->
            <section id="classbar" class="sidebar">
                <aside>
                    <nav>
                        <ul>
                            <li><a href="/dashboard">Início</a></li>
                            <li><a href="/equipamentos">Equipamentos</a></li>
                            <li><a href="/emprestimo">Movimentações</a></li>
                        </ul>
                    </nav>
                </aside>
            </section>

            <section class="main-content">
                <div class="d-flex justify-content-center align-items-center vh-100 p-4">
                    <div class="createitem-card">
                        <h3 class="fw-bold text-center mb-4">Adicionar Novo Equipamento</h3>
                        <form id="form-createitem" action="{{ url_for('createitem.create_item') }}" method="POST">
                            <div class="input-group mb-3">
                                <span class="input-group-text border-icon"><i class="bi bi-box-seam"></i></span>
                                <input type="text" id="createInput" class="form-control" name="marca" placeholder="Digite a marca do equipamento" required>
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text border-icon"><i class="bi bi-hash"></i></span>
                                <input type="text" id="createInput" class="form-control" name="num_serie" placeholder="Digite o número de série do equipamento" required>
                            </div>

                            <select class="input-group mb-3 form-select border-icon" name="categoria" required>
                                <option value="" disabled selected>Selecione a Categoria do Equipamento</option>
                                <option value="passa-slide">Passador de Slides</option>
                                <option value="monitor">Monitor</option>
                                <option value="projetor">Projetor</option>
                                <option value="cabo">Cabo</option>
                                <option value="mouse">Mouse</option>
                            </select>

                            <button type="submit" class="btn btn-primary w-100 text-dark text-black fw-semibold">Adicionar</button>
                    </div>
                </div>
            </section>

        </main>

         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>

</html>
