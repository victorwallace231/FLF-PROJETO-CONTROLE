<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Cadastro - Moderno</title>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex justify-content-center align-items-center vh-100 p-3">
        <div class="cadastro-card">
            <img src="logo-removebg-preview.png" alt="Logo" class="img-cadastro">
            <h2 class="fw-bold text-center mb-2 mt-2">Cadastro</h2>
            <p class="text-center">Insira suas informações abaixos.</p>
            <form action="">
                <div class="input-group mb-3">
                    <span class="input-group-text border-icon"> <i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" placeholder="Digite seu nome">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text border-icon"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control" placeholder="Digite seu e-mail">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text border-icon"><i class="bi bi-telephone-fill"></i></span>
                    <input type="tel" class="form-control" placeholder="Digite seu telefone">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text border-icon"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" placeholder="Digite sua senha">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text border-icon"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" placeholder="Confirme sua senha">
                </div>

                <button type="submit" class="btn btn-primary w-100 text-dark text-black fw-semibold">Entrar</button>
                
                <p class="text-center">
                    Já possui uma conta? 
                    <a href="" class="text-b fw-semibold text-decoration-none">Entrar</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
